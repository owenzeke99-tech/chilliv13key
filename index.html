
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chilli X Venyx X Divine V13</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ff2020;
    --red2: #ff5555;
    --red3: #8b0000;
    --black: #050505;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #030303;
    color: white;
    font-family: Inter, sans-serif;
    overflow: hidden;
}

/* BACKGROUND */

.bg {
    position: fixed;
    inset: 0;
    z-index: -10;
    background:
        radial-gradient(circle at 50% 50%, #2c0808 0%, transparent 50%),
        radial-gradient(circle at 0% 0%, #350000 0%, transparent 35%),
        #030303;
}

.bg-grid {
    position: fixed;
    inset: 0;
    z-index: -9;
    background-image:
        linear-gradient(#ff000009 1px, transparent 1px),
        linear-gradient(90deg, #ff000009 1px, transparent 1px);
    background-size: 35px 35px;
    animation: gridMove 12s linear infinite;
}

@keyframes gridMove {
    to { background-position: 35px 35px; }
}

/* BACKGROUND BLOBS */

.blob {
    position: fixed;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: -8;
    animation: blobMove 9s ease-in-out infinite alternate;
}

.blob1 {
    background: #ff000033;
    top: -150px;
    left: -100px;
}

.blob2 {
    background: #a0000028;
    bottom: -150px;
    right: -100px;
    animation-delay: -3s;
}

.blob3 {
    background: #ff222215;
    top: 40%;
    left: 40%;
    animation-delay: -5s;
}

@keyframes blobMove {
    0% {
        transform: translate(0,0) scale(.8);
    }
    100% {
        transform: translate(120px,80px) scale(1.4);
    }
}

/* PARTICLES */

#particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -5;
    pointer-events: none;
}

.particle {
    position: absolute;
    background: #ff3030;
    border-radius: 50%;
    box-shadow:
        0 0 5px #ff0000,
        0 0 15px #ff000060;
    animation: particleUp linear infinite;
}

@keyframes particleUp {
    0% {
        transform: translateY(0) translateX(0) scale(0);
        opacity: 0;
    }
    15% {
        opacity: 1;
        transform: scale(1);
    }
    70% {
        opacity: .7;
    }
    100% {
        transform: translateY(-110vh) translateX(100px) scale(.2);
        opacity: 0;
    }
}

/* ENERGY LINES */

.energy {
    position: fixed;
    width: 2px;
    height: 200px;
    background: linear-gradient(
        transparent,
        #ff000080,
        #ff5555,
        transparent
    );
    opacity: .2;
    animation: energyMove 5s linear infinite;
}

.energy1 {
    left: 10%;
    top: -200px;
}

.energy2 {
    left: 75%;
    top: -300px;
    animation-delay: 2s;
}

.energy3 {
    left: 90%;
    top: -200px;
    animation-delay: 3s;
}

@keyframes energyMove {
    to {
        transform: translateY(120vh);
    }
}

/* CONTAINER */

.container {
    width: 100%;
    max-width: 460px;
    padding: 20px;
    animation: pageEnter 1.1s cubic-bezier(.16,1,.3,1);
}

@keyframes pageEnter {
    from {
        opacity: 0;
        transform: translateY(40px) scale(.9);
        filter: blur(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* CARD */

.card {
    position: relative;
    padding: 34px 24px 25px;
    border-radius: 25px;
    background: linear-gradient(145deg, #180d0d, #080808 65%);
    border: 1px solid #441414;
    overflow: hidden;
    isolation: isolate;
    box-shadow:
        0 25px 80px #000,
        0 0 25px #ff000010,
        inset 0 0 30px #ff000008;
    transition: transform .15s ease;
}

/* Animated border */

.card-border {
    position: absolute;
    inset: 0;
    border-radius: 25px;
    padding: 1.5px;
    background: conic-gradient(
        from 0deg,
        transparent,
        #650000,
        #ff2020,
        #ffaaaa,
        #ff2020,
        #700000,
        transparent,
        #ff3030,
        transparent
    );
    animation: rotateBorder 4s linear infinite;
    z-index: -1;
    opacity: .8;
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

@keyframes rotateBorder {
    to { transform: rotate(360deg); }
}

/* Card light sweep */

.card-sweep {
    position: absolute;
    width: 150%;
    height: 100%;
    left: -180%;
    top: 0;
    transform: skewX(-25deg);
    background: linear-gradient(
        90deg,
        transparent,
        #ff000008,
        #ff444415,
        #ffffff06,
        transparent
    );
    animation: cardSweep 7s ease-in-out infinite;
    pointer-events: none;
}

@keyframes cardSweep {
    0%, 70% { left: -180%; }
    100% { left: 180%; }
}

/* Floating sparks inside card */

.card-spark {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #ff3333;
    border-radius: 50%;
    box-shadow: 0 0 8px #ff0000;
    animation: sparkFloat 4s ease-in-out infinite;
    pointer-events: none;
}

@keyframes sparkFloat {
    0%, 100% {
        transform: translateY(0);
        opacity: .1;
    }
    50% {
        transform: translateY(-25px);
        opacity: 1;
    }
}

/* TITLE */

.title {
    text-align: center;
    font-family: Orbitron, sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5.5vw, 29px);
    line-height: 1.5;
    letter-spacing: -1px;
    text-transform: uppercase;
    background: linear-gradient(
        180deg,
        #fff 0%,
        #ffcaca 20%,
        #ff4141 50%,
        #b00000 75%,
        #ff5252 100%
    );
    background-size: 100% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titleGradient 5s ease infinite;
    filter: drop-shadow(0 0 10px #ff000040);
}

@keyframes titleGradient {
    0%, 100% { background-position: 0 0; }
    50% { background-position: 0 100%; }
}

.subtitle {
    text-align: center;
    color: #777;
    margin-top: 10px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 4px;
}

/* STATUS */

.status {
    display: flex;
    justify-content: center;
    margin-top: 24px;
}

.status-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 16px;
    border-radius: 50px;
    background: linear-gradient(90deg, #210707, #330909, #210707);
    border: 1px solid #722020;
    color: #ff7777;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
    animation: statusGlow 2s infinite;
}

@keyframes statusGlow {
    0%, 100% {
        box-shadow: 0 0 4px #ff000010;
    }
    50% {
        box-shadow: 0 0 20px #ff000040;
    }
}

.dot {
    width: 7px;
    height: 7px;
    background: #ff2222;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff2222;
    animation: dotBeat 1s infinite;
}

@keyframes dotBeat {
    50% {
        transform: scale(.5);
        opacity: .4;
    }
}

/* KEY HEADER */

.key-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    margin-bottom: 12px;
    color: #929292;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
}

.key-status {
    color: #ff4444;
    font-size: 9px;
    letter-spacing: 1px;
    animation: statusBlink 1.5s infinite;
}

@keyframes statusBlink {
    50% { opacity: .4; }
}

/* KEY MENU - EXTRA EFFECTS */

.key-box {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 72px;
    padding: 18px 14px;
    border-radius: 15px;
    background:
        linear-gradient(145deg, #100606, #070707);
    border: 1px solid #511818;
    overflow: hidden;
    isolation: isolate;
    transition: .4s;
    animation: keyPulse 2.8s ease infinite;
}

@keyframes keyPulse {
    0%, 100% {
        box-shadow:
            0 0 8px #ff000008,
            inset 0 0 5px #ff000005;
        border-color: #461414;
    }
    50% {
        box-shadow:
            0 0 22px #ff000025,
            inset 0 0 15px #ff000010;
        border-color: #a52c2c;
    }
}

/* Animated key frame */

.key-frame {
    position: absolute;
    inset: 0;
    border-radius: 15px;
    padding: 1px;
    background: linear-gradient(
        90deg,
        #410000,
        #ff2020,
        #ffaaaa,
        #ff2020,
        #410000
    );
    background-size: 300% 100%;
    animation: keyFrameFlow 3s linear infinite;
    z-index: -1;
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
}

@keyframes keyFrameFlow {
    to { background-position: 300% 0; }
}

/* Key scanning laser */

.key-laser {
    position: absolute;
    width: 80%;
    height: 100%;
    top: 0;
    left: -120%;
    background: linear-gradient(
        90deg,
        transparent,
        #ff000010,
        #ff555530,
        #ffffff12,
        #ff000010,
        transparent
    );
    transform: skewX(-20deg);
    animation: laserScan 3.5s ease-in-out infinite;
    pointer-events: none;
}

@keyframes laserScan {
    0%, 55% { left: -120%; }
    100% { left: 150%; }
}

/* Multiple scan lines */

.key-scanline {
    position: absolute;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        #ff303050,
        transparent
    );
    animation: scanVertical 4s linear infinite;
    pointer-events: none;
}

@keyframes scanVertical {
    0% { top: -2px; opacity: 0; }
    15% { opacity: .8; }
    90% { opacity: .5; }
    100% { top: 100%; opacity: 0; }
}

/* Key text */

.key-text {
    position: relative;
    z-index: 3;
    flex: 1;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    user-select: all;
    text-shadow:
        0 0 5px #ff000030,
        0 0 15px #ff000015;
    animation: keyTextGlow 2.5s ease-in-out infinite;
}

.key-text::-webkit-scrollbar {
    display: none;
}

@keyframes keyTextGlow {
    0%, 100% {
        text-shadow: 0 0 4px #ff000015;
        color: #eeeeee;
    }
    50% {
        text-shadow:
            0 0 8px #ff000060,
            0 0 20px #ff000025;
        color: #fff;
    }
}

/* KEY ICON */

.key-icon {
    position: relative;
    z-index: 3;
    flex-shrink: 0;
    color: #ff4545;
    animation: iconFloat 2s ease infinite;
}

@keyframes iconFloat {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-3px) rotate(5deg);
    }
}

/* Key hover */

.key-box:hover {
    transform: translateY(-3px) scale(1.015);
    border-color: #ff3030;
    box-shadow:
        0 0 25px #ff000035,
        inset 0 0 20px #ff000010;
}

/* BUTTON */

.copy-button {
    position: relative;
    width: 100%;
    height: 58px;
    margin-top: 15px;
    overflow: hidden;
    border: 1px solid #a52b2b;
    border-radius: 14px;
    color: white;
    font-family: Orbitron, sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.5px;
    background: linear-gradient(
        90deg,
        #8b0000,
        #ff2525,
        #b00000,
        #ff3030
    );
    background-size: 300% 100%;
    animation: buttonFlow 4s linear infinite;
    cursor: pointer;
    transition: .3s;
    box-shadow: 0 5px 20px #ff000025;
}

@keyframes buttonFlow {
    to { background-position: 300% 0; }
}

.copy-button::before {
    content: "";
    position: absolute;
    inset: -100% -100%;
    background: linear-gradient(
        120deg,
        transparent 40%,
        #ffffff40 50%,
        transparent 60%
    );
    animation: buttonShine 3s infinite;
}

@keyframes buttonShine {
    0%, 60% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.copy-button::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    border: 1px solid #ffaaaa35;
    animation: buttonBorderPulse 2s infinite;
}

@keyframes buttonBorderPulse {
    50% {
        border-color: #ffffff70;
    }
}

.copy-button:hover {
    transform: translateY(-3px);
    filter: brightness(1.2);
    box-shadow: 0 10px 35px #ff000055;
}

.copy-button:active {
    transform: scale(.96);
}

/* Ripple effect */

.ripple {
    position: absolute;
    border-radius: 50%;
    background: #ffffff50;
    pointer-events: none;
    transform: scale(0);
    animation: rippleEffect .7s ease-out;
}

@keyframes rippleEffect {
    to {
        transform: scale(5);
        opacity: 0;
    }
}

/* Divider */

.divider {
    position: relative;
    height: 1px;
    margin-top: 25px;
    overflow: hidden;
    background: #301111;
}

.divider::after {
    content: "";
    position: absolute;
    height: 100%;
    width: 40%;
    left: -50%;
    background: linear-gradient(
        90deg,
        transparent,
        #ff3333,
        #ffffff,
        #ff3333,
        transparent
    );
    animation: dividerRun 3s linear infinite;
}

@keyframes dividerRun {
    to { left: 150%; }
}

/* FOOTER */

.footer {
    margin-top: 23px;
    text-align: center;
    color: #555;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 900;
}

.footer span {
    color: #ff4444;
    text-shadow: 0 0 10px #ff000030;
}

/* TOAST */

.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translate(-50%, 30px) scale(.8);
    opacity: 0;
    pointer-events: none;
    padding: 14px 20px;
    border-radius: 12px;
    background: #160606;
    border: 1px solid #822222;
    color: #ff7777;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    white-space: nowrap;
    box-shadow:
        0 0 20px #ff000030,
        0 10px 40px #000;
    transition: .4s cubic-bezier(.16,1,.3,1);
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
}

/* COPY SUCCESS ANIMATION */

.key-box.copied {
    animation: copiedEffect .7s ease;
}

@keyframes copiedEffect {
    0% { transform: scale(1); }
    40% { transform: scale(1.04); }
    100% { transform: scale(1); }
}

/* MOBILE */

@media(max-width: 400px) {
    .container {
        padding: 15px;
    }

    .card {
        padding: 28px 18px 22px;
    }

    .title {
        font-size: 21px;
    }

    .key-text {
        font-size: 11px;
    }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="bg-grid"></div>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="energy energy1"></div>
<div class="energy energy2"></div>
<div class="energy energy3"></div>

<div id="particles"></div>

<div class="container">
    <div class="card" id="card">

        <div class="card-border"></div>
        <div class="card-sweep"></div>

        <h1 class="title">
            Chilli X Venyx X Divine V13
        </h1>

        <p class="subtitle">
            PREMIUM KEY SYSTEM
        </p>

        <div class="status">
            <div class="status-badge">
                <span class="dot"></span>
                KEY ACTIVE
            </div>
        </div>

        <div class="key-label">
            <span>YOUR KEY</span>
            <span class="key-status">● SECURE</span>
        </div>

        <!-- KEY MENU -->
        <div class="key-box" id="keyBox">

            <div class="key-frame"></div>
            <div class="key-laser"></div>
            <div class="key-scanline"></div>

            <div class="key-text" id="key">
                ChillixV13GiaBinhBaKhiKey - KsksjwnwkoLkshwowoweho
            </div>

            <div class="key-icon">
                <svg width="19" height="19" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </div>

        </div>

        <button class="copy-button" id="copyButton" onclick="copyKey(event)">
            COPY KEY
        </button>

        <div class="divider"></div>

        <div class="footer">
            POWERED BY <span>CHILLI X VENYX X DIVINE</span>
        </div>

    </div>
</div>

<div class="toast" id="toast">
    ✓ KEY COPIED SUCCESSFULLY
</div>

<script>

/* PARTICLES GENERATOR */

const particleBox = document.getElementById("particles");

for (let i = 0; i < 65; i++) {
    const p = document.createElement("div");
    p.className = "particle";

    const size = Math.random() * 3 + 1;

    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDuration = (5 + Math.random() * 15) + "s";
    p.style.animationDelay = Math.random() * 12 + "s";

    particleBox.appendChild(p);
}

/* CARD SPARKS */

const card = document.getElementById("card");

for (let i = 0; i < 15; i++) {
    const spark = document.createElement("div");
    spark.className = "card-spark";

    spark.style.left = Math.random() * 100 + "%";
    spark.style.top = Math.random() * 100 + "%";
    spark.style.animationDelay = Math.random() * 4 + "s";

    card.appendChild(spark);
}

/* COPY KEY */

function copyKey(event) {

    const key = document.getElementById("key").innerText.trim();
    const button = document.getElementById("copyButton");
    const toast = document.getElementById("toast");
    const keyBox = document.getElementById("keyBox");

    /* RIPPLE */
    if (event) {
        const rect = button.getBoundingClientRect();
        const ripple = document.createElement("span");

        ripple.className = "ripple";

        const size = Math.max(rect.width, rect.height);

        ripple.style.width = size + "px";
        ripple.style.height = size + "px";
        ripple.style.left = (event.clientX - rect.left - size / 2) + "px";
        ripple.style.top = (event.clientY - rect.top - size / 2) + "px";

        button.appendChild(ripple);

        setTimeout(() => ripple.remove(), 700);
    }

    function success() {
        button.innerText = "COPIED SUCCESSFULLY ✓";
        toast.classList.add("show");

        keyBox.classList.remove("copied");
        void keyBox.offsetWidth;
        keyBox.classList.add("copied");

        if (navigator.vibrate) {
            navigator.vibrate(50);
        }

        setTimeout(() => {
            toast.classList.remove("show");
            button.innerText = "COPY KEY";
        }, 2200);
    }

    function fallback() {
        const area = document.createElement("textarea");

        area.value = key;
        area.style.position = "fixed";
        area.style.left = "-9999px";

        document.body.appendChild(area);
        area.focus();
        area.select();

        try {
            document.execCommand("copy");
            success();
        } catch (e) {
            alert("Copy this key manually:\n" + key);
        }

        area.remove();
    }

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(key)
            .then(success)
            .catch(fallback);
    } else {
        fallback();
    }
}

/* 3D MOUSE EFFECT */

document.addEventListener("mousemove", (e) => {

    if (window.innerWidth < 700) return;

    const x = (window.innerWidth / 2 - e.clientX) / 45;
    const y = (window.innerHeight / 2 - e.clientY) / 45;

    card.style.transform =
        `perspective(1200px) rotateY(${x}deg) rotateX(${y}deg)`;
});

document.addEventListener("mouseleave", () => {
    card.style.transform =
        "perspective(1200px) rotateY(0deg) rotateX(0deg)";
});

/* KEY MENU CLICK EFFECT */

const keyBox = document.getElementById("keyBox");

keyBox.addEventListener("click", () => {
    keyBox.style.transform = "scale(.985)";

    setTimeout(() => {
        keyBox.style.transform = "";
    }, 150);
});

</script>

</body>
</html>
